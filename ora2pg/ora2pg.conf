# ========================================
# ora2pg Configuration File
# SkyReward Airlines - Oracle to Azure PostgreSQL Migration
# ========================================
# Generated for migration assessment and schema conversion
# Target: Azure Database for PostgreSQL - Flexible Server

# ----------------------------------------
# Oracle Database Connection
# ----------------------------------------
ORACLE_HOME     /usr/lib/oracle/21/client64
ORACLE_DSN      dbi:Oracle:host=localhost;sid=XEPDB1;port=1521
ORACLE_USER     skyreward
ORACLE_PWD      SkyReward123

# ----------------------------------------
# PostgreSQL Target Connection
# ----------------------------------------
PG_DSN          dbi:Pg:dbname=skyreward;host=localhost;port=5432
PG_USER         skyreward
PG_PWD          SkyReward123

# ----------------------------------------
# Schema Configuration
# ----------------------------------------
SCHEMA          SKYREWARD
EXPORT_SCHEMA   0
CREATE_SCHEMA   1
PG_SCHEMA       public

# ----------------------------------------
# Export Type (run ora2pg multiple times with different types)
# ----------------------------------------
# Supported types: TABLE, VIEW, GRANT, SEQUENCE, TRIGGER, FUNCTION,
#                  PROCEDURE, PACKAGE, INSERT, COPY, PARTITION,
#                  TYPE, TABLESPACE, FDW, MVIEW, QUERY, DBLINK,
#                  SYNONYM, DIRECTORY, SHOW_VERSION, SHOW_REPORT
TYPE            TABLE

# ----------------------------------------
# Output Configuration
# ----------------------------------------
OUTPUT          postgresql/output.sql
OUTPUT_DIR      postgresql/
FILE_PER_TABLE  1
FILE_PER_FUNCTION 1
FILE_PER_INDEX  0
BINMODE         utf8

# ----------------------------------------
# Data Export Settings
# ----------------------------------------
DATA_LIMIT      10000
SKIP_FKEYS      0
TRUNCATE_TABLE  1
DISABLE_SEQUENCE 0
NLS_LANG        AMERICAN_AMERICA.UTF8
CLIENT_ENCODING UTF8

# ----------------------------------------
# Table and Object Filtering
# ----------------------------------------
# Export all SkyReward tables (no filtering)
# ALLOW          members,flights,rewards,redemptions,partners,partner_transactions,tier_rules,miles_expiry,audit_log,notifications,batch_processing_log
# EXCLUDE

# ----------------------------------------
# Data Type Mapping (Oracle -> PostgreSQL)
# ----------------------------------------
# ora2pg applies these defaults; override as needed
DATA_TYPE       DATE:timestamp,LONG:text,LONG RAW:bytea,CLOB:text,NCLOB:text,BLOB:bytea,BFILE:bytea,RAW:bytea,ROWID:oid,FLOAT:double precision,DEC:decimal,DECIMAL:decimal,DOUBLE PRECISION:double precision,INT:integer,INTEGER:integer,REAL:real,SMALLINT:smallint,BINARY_FLOAT:double precision,BINARY_DOUBLE:double precision,TIMESTAMP:timestamp,XMLTYPE:xml,BINARY_INTEGER:integer,PLS_INTEGER:integer,TIMESTAMP WITH TIME ZONE:timestamp with time zone,TIMESTAMP WITH LOCAL TIME ZONE:timestamp with time zone

# ----------------------------------------
# PL/SQL to PL/pgSQL Conversion
# ----------------------------------------
PLSQL_PGSQL     1
NULL_EQUAL_EMPTY 1
EXPORT_INVALID  0

# Replace Oracle-specific functions
REPLACE_AS_BOOLEAN  NVL,DECODE
USE_TABLESPACE  0

# ----------------------------------------
# Sequence Configuration
# ----------------------------------------
# Preserve sequence start values for data consistency
PRESERVE_CASE   0
KEEP_PKEY_NAMES 1

# ----------------------------------------
# Index Configuration
# ----------------------------------------
# Bitmap indexes will be converted to standard B-tree
BITMAP_AS_GIN   0
SKIP_INDICES    0
REORDERING_COLUMNS 1

# ----------------------------------------
# Trigger Configuration
# ----------------------------------------
# Convert Oracle triggers to PostgreSQL trigger functions
DISABLE_TRIGGER 0

# ----------------------------------------
# Performance Settings
# ----------------------------------------
JOBS            4
ORACLE_COPIES   4
PARALLEL_TABLES 4
DATA_TYPE_GUESS 0
LONGREADLEN     1048576

# ----------------------------------------
# Assessment / Migration Report
# ----------------------------------------
# Run with TYPE SHOW_REPORT to generate migration assessment
# ora2pg -c ora2pg.conf -t SHOW_REPORT --estimate_cost
COST_UNIT_VALUE 10
HUMAN_DAYS_LIMIT 5

# ----------------------------------------
# Logging
# ----------------------------------------
DEBUG           0
LOG_ON_ERROR    1
LOGFILE         postgresql/ora2pg.log

# ----------------------------------------
# Advanced Options
# ----------------------------------------
# Handle SYSDATE -> CURRENT_TIMESTAMP conversion
STOP_ON_ERROR   0
COMPILE_SCHEMA  0

# Oracle Text indexes -> PostgreSQL tsvector/GIN
# CTXSYS.CONTEXT indexes need manual conversion to pg_trgm or tsvector

# Oracle AQ -> PostgreSQL pg_notify or external message broker
# DBMS_AQ, DBMS_AQADM need manual migration

# DBMS_SCHEDULER -> pg_cron or external scheduler
# DBMS_SCHEDULER jobs need manual migration to pg_cron

# Autonomous transactions (PRAGMA AUTONOMOUS_TRANSACTION)
# Need conversion to dblink-based approach or separate connection
