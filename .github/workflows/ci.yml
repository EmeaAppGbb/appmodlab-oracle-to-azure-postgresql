name: CI – Schema Validation

on:
  push:
    branches: [main]
    paths:
      - 'postgresql/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'postgresql/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  PGHOST: localhost
  PGPORT: 5432
  PGUSER: skyreward_admin
  PGPASSWORD: PostgresPass123
  PGDATABASE: skyreward

jobs:
  validate:
    name: Deploy & Validate Schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: skyreward_admin
          POSTGRES_PASSWORD: PostgresPass123
          POSTGRES_DB: skyreward
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skyreward_admin -d skyreward"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U skyreward_admin -d skyreward && break
            echo "Waiting for PostgreSQL... ($i)"
            sleep 2
          done

      - name: Deploy schema (setup.sql)
        working-directory: postgresql
        run: |
          psql -v ON_ERROR_STOP=1 --no-psqlrc -f setup.sql 2>&1 | tail -50

      - name: Validate schema objects
        run: |
          psql -v ON_ERROR_STOP=1 --no-psqlrc -f scripts/validate-schema.sql

      - name: Validate functions
        run: |
          psql -v ON_ERROR_STOP=1 --no-psqlrc -f scripts/validate-functions.sql

      - name: Run integration tests
        run: |
          FAILED=0
          for f in tests/integration/test_*.sql; do
            echo "=== Running: $f ==="
            if ! psql -v ON_ERROR_STOP=1 --no-psqlrc -f "$f" 2>&1; then
              echo "FAILED: $f"
              FAILED=$((FAILED + 1))
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "❌ $FAILED integration test(s) failed"
            exit 1
          fi
          echo "✅ All integration tests passed"

      - name: Run data migration validation
        run: |
          if [ -f scripts/validate-migration.sql ]; then
            psql -v ON_ERROR_STOP=1 --no-psqlrc -f scripts/validate-migration.sql
          else
            echo "validate-migration.sql not found – skipping"
          fi
