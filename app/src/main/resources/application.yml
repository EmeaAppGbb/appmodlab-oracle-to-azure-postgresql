# =============================================================================
# SkyReward Application - PostgreSQL Configuration (post-migration)
# =============================================================================
# This configuration connects to the PostgreSQL database that replaced Oracle.
# See application-oracle.yml for the pre-migration Oracle configuration.

spring:
  application:
    name: skyreward

  # ---------------------------------------------------------------------------
  # PostgreSQL DataSource Configuration
  # ---------------------------------------------------------------------------
  # MIGRATION NOTE:
  #   Oracle JDBC URL:  jdbc:oracle:thin:@localhost:1521/SKYREWARD
  #   PostgreSQL URL:   jdbc:postgresql://localhost:5433/skyreward
  #
  # The PostgreSQL JDBC driver class (org.postgresql.Driver) is auto-detected
  # by Spring Boot from the URL prefix "jdbc:postgresql://".
  datasource:
    url: jdbc:postgresql://localhost:5433/skyreward
    username: skyreward_admin
    password: PostgresPass123
    driver-class-name: org.postgresql.Driver

    # HikariCP connection pool (Spring Boot default)
    # MIGRATION NOTE: Replaces Oracle UCP (Universal Connection Pool)
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: SkyRewardHikariPool

  # ---------------------------------------------------------------------------
  # JPA / Hibernate Configuration
  # ---------------------------------------------------------------------------
  jpa:
    # MIGRATION NOTE: Changed from org.hibernate.dialect.OracleDialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # validate: ensures entities match existing schema without modifying it
      ddl-auto: validate
    properties:
      hibernate:
        # Format SQL output for readability in logs
        format_sql: true
        # MIGRATION NOTE: PostgreSQL uses standard SQL quoting with double quotes;
        # Oracle used the same, but be aware of case sensitivity differences.
        globally_quoted_identifiers: false
    show-sql: false

  # ---------------------------------------------------------------------------
  # Flyway Database Migration Configuration
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # MIGRATION NOTE: Set baseline version to match the schema already deployed
    baseline-version: "0"
    # Validate that applied migrations match the ones in the classpath
    validate-on-migrate: true

# ---------------------------------------------------------------------------
# Server Configuration
# ---------------------------------------------------------------------------
server:
  port: 8080

# ---------------------------------------------------------------------------
# Actuator Endpoints
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level:
    com.skyreward: INFO
    org.springframework.data: INFO
    # Enable SQL logging during development/debugging
    # org.hibernate.SQL: DEBUG
    # org.hibernate.type.descriptor.sql.BasicBinder: TRACE
